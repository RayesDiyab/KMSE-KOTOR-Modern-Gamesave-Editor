[package]
name = "kotor-modern-gamesave-editor"
version = "1.0.0"
edition = "2021"
description = "KOTOR Modern Gamesave Editor: opens KotOR 1 and KotOR 2 saves and changes them safely"
authors = ["RaymanGT"]
license = "GPL-3.0-or-later"
publish = false

[[bin]]
name = "kotor-modern-gamesave-editor"
path = "src/main.rs"

[lib]
name = "kse_core"
path = "src/lib.rs"

[dependencies]
slint = { version = "1.18", default-features = false, features = ["std", "compat-1-2", "backend-winit", "renderer-software", "unstable-winit-030"] }
rfd = { version = "0.16", default-features = false, features = ["xdg-portal", "tokio"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# the quest databases are carried deflated (build.rs); already in the tree through png
miniz_oxide = "0.8"

[target.'cfg(windows)'.dependencies]
winreg = "0.56"

[build-dependencies]
slint-build = "1.18"
miniz_oxide = "0.8"

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true

# For the tests only (build.ps1 runs them beside the release build, on the cores it leaves
# idle): optimised, without the release build's whole-program pass, so they build in a
# fraction of its time. The program in dist is always the release profile above.
[profile.tests]
inherits = "release"
lto = false
codegen-units = 16
incremental = true
panic = "unwind"
strip = false
