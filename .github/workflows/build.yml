# Builds and tests the KOTOR Modern Gamesave Editor on Windows, Linux and macOS, and makes
# the macOS app and the Linux AppImage.
#
# The runners have no KotOR install, so the tests that read real saves find none and
# pass empty. The window's fonts are committed (fonts/, OFL 1.1), so the
# builds here are set in KMRP's own fonts like a release; this checks that the editor
# compiles and its unit tests pass everywhere. The links job checks that every relative
# link in the Markdown documents resolves, as KMRP's CI does.
name: KMSE

on:
  push:
    branches: [master]
    paths: ["**"]
  pull_request:
    paths: ["**"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - name: Linux window libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libfontconfig1-dev libwayland-dev libx11-dev libxcursor-dev libxi-dev libxrandr-dev
      - name: Test
        run: cargo test --release
      - name: Build
        run: cargo build --release
      # macOS: the app as a player gets it (Universal 2, ad hoc signed, not notarized; no
      # KotOR on the runner, so no Yavin Station picture), from the same script as a release
      - name: macOS app
        if: runner.os == 'macOS'
        run: |
          rustup target add aarch64-apple-darwin x86_64-apple-darwin
          sh build-macos.sh --no-tests
      - uses: actions/upload-artifact@v7
        if: runner.os == 'macOS'
        with:
          name: KMSE-macOS
          path: |
            dist/KMSE-*-macOS.dmg
            dist/KMSE-*-macOS.zip
      - uses: actions/upload-artifact@v7
        with:
          name: kotor-modern-gamesave-editor-${{ runner.os }}
          path: |
            build/target/release/kotor-modern-gamesave-editor
            build/target/release/kotor-modern-gamesave-editor.exe
          if-no-files-found: ignore

  # Linux: the AppImage as a player gets it, from the same script as a release. Built on the
  # oldest Ubuntu GitHub offers, as the program runs on the glibc it was built with or newer
  # (ubuntu-latest's build needs glibc 2.43, newer than most Linux desktops have). The tests
  # run in the build job above.
  appimage:
    name: Linux AppImage
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - name: Linux window libraries
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libfontconfig1-dev libwayland-dev libx11-dev libxcursor-dev libxi-dev libxrandr-dev
      - name: AppImage
        run: sh build-linux.sh --no-tests
      - uses: actions/upload-artifact@v7
        with:
          name: KMSE-Linux
          path: dist/KMSE-Linux-*-x86_64.AppImage
          if-no-files-found: error

  links:
    name: Documentation links
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Check relative Markdown links resolve
        run: python .github/scripts/check_links.py
