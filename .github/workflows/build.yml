# Checks the KOTOR Modern Gamesave Editor on Windows, Linux and macOS: it compiles and its
# tests pass. The releases (the Windows program, the macOS app, the Linux AppImage) are built
# on the maintainer's machines with build.ps1, build-macos.sh and build-linux.sh, not here: CI
# making them took too long (2026-11-09, the maintainer).
#
# The runners have no KotOR install, so the tests that read real saves find none and pass
# empty. The links job checks that every relative link in the Markdown documents resolves, as
# KMRP's CI does.
name: KMSE

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - name: Linux window libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libfontconfig1-dev libwayland-dev libx11-dev libxcursor-dev libxi-dev libxrandr-dev
      - uses: Swatinem/rust-cache@v2
      - name: Tests
        run: cargo test --profile tests

  links:
    name: Documentation links
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Check relative Markdown links resolve
        run: python .github/scripts/check_links.py
